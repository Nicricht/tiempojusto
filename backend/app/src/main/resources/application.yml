spring:
  application:
    name: tiempojusto
  datasource:
    url: ${TJ_DB_URL:jdbc:postgresql://localhost:5432/tiempojusto}
    username: ${TJ_DB_USER:tiempojusto}
    password: ${TJ_DB_PASSWORD:tiempojusto}
    hikari:
      maximum-pool-size: ${TJ_DB_POOL_MAX:10}
      minimum-idle: ${TJ_DB_POOL_MIN:2}
      connection-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

tiempojusto:
  runtime:
    verify-database: ${TJ_VERIFY_DATABASE:true}
  auth:
    dev-header-enabled: ${TJ_AUTH_DEV_HEADER_ENABLED:false}
    jwt-enabled: ${TJ_AUTH_JWT_ENABLED:false}
    jwt:
      issuer: ${TJ_AUTH_JWT_ISSUER:}
      audience: ${TJ_AUTH_JWT_AUDIENCE:}
      jwk-set-uri: ${TJ_AUTH_JWT_JWK_SET_URI:}
      hmac-secret-b64: ${TJ_AUTH_JWT_HMAC_SECRET_B64:}
    refresh:
      enabled: ${TJ_AUTH_REFRESH_ENABLED:false}
      token-uri: ${TJ_AUTH_REFRESH_TOKEN_URI:}
      client-id: ${TJ_AUTH_REFRESH_CLIENT_ID:}
      client-secret: ${TJ_AUTH_REFRESH_CLIENT_SECRET:}
  kyc:
    provider: ${TJ_KYC_PROVIDER:}
    callback-url: ${TJ_KYC_CALLBACK_URL:}
    veriff:
      base-url: ${TJ_KYC_VERIFF_BASE_URL:}
      api-key: ${TJ_KYC_VERIFF_API_KEY:}
      shared-secret: ${TJ_KYC_VERIFF_SHARED_SECRET:}
  payment:
    provider: ${TJ_PAYMENT_PROVIDER:MOCK}
    mercado-pago:
      base-url: ${TJ_PAYMENT_MP_BASE_URL:https://api.mercadopago.com}
      access-token: ${TJ_PAYMENT_MP_ACCESS_TOKEN:}
      webhook-secret: ${TJ_PAYMENT_MP_WEBHOOK_SECRET:}
      instrument-ttl-seconds: ${TJ_PAYMENT_MP_INSTRUMENT_TTL_SECONDS:600}
    reconciliation:
      poll-ms: ${TJ_PAYMENT_RECONCILIATION_POLL_MS:5000}
      max-attempts: ${TJ_PAYMENT_RECONCILIATION_MAX_ATTEMPTS:8}
