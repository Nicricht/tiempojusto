services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: tiempojusto
      POSTGRES_USER: tiempojusto
      POSTGRES_PASSWORD: tiempojusto
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiempojusto -d tiempojusto"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - tiempojusto_pgdata:/var/lib/postgresql/data

volumes:
  tiempojusto_pgdata:
