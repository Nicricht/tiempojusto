name: Realtime Protocol

on:
  push:
    paths:
      - 'api/realtime/**'
      - '.github/workflows/realtime.yml'
  pull_request:
    paths:
      - 'api/realtime/**'
      - '.github/workflows/realtime.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate WebSocket V1
        run: python api/realtime/validate_protocol.py
