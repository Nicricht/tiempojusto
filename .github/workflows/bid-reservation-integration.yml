name: Bid Reservation Integration

on:
  pull_request:
    paths:
      - 'backend/finance/**'
      - 'backend/app/**'
      - 'database/migrations/V1_8__bid_reservation_replacement.sql'
      - 'docs/runtime/BID_RESERVATION_SAFETY_V1.md'
      - '.github/workflows/bid-reservation-integration.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/finance/**'
      - 'backend/app/**'
      - 'database/migrations/V1_8__bid_reservation_replacement.sql'
      - 'docs/runtime/BID_RESERVATION_SAFETY_V1.md'
      - '.github/workflows/bid-reservation-integration.yml'

jobs:
  bid-reservation-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: tiempojusto
          POSTGRES_USER: tiempojusto
          POSTGRES_PASSWORD: tiempojusto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiempojusto -d tiempojusto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: tiempojusto
      TJ_DB_URL: jdbc:postgresql://localhost:5432/tiempojusto
      TJ_DB_USER: tiempojusto
      TJ_DB_PASSWORD: tiempojusto
      TJ_AUTH_DEV_HEADER_ENABLED: 'true'
      SPRING_PROFILES_ACTIVE: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Finance and reservation coordinator contracts
        run: cd backend/finance && bash run-tests.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema and migrations through V1.8
        run: |
          psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/schema/TiempoJusto_PostgreSQL_Schema_V1_0.sql
          for f in \
            database/migrations/V1_1__geo_routing_eta.sql \
            database/migrations/V1_2__webrtc_media.sql \
            database/migrations/V1_3__oauth2_identity.sql \
            database/migrations/V1_4__online_reconnect_persistence.sql \
            database/migrations/V1_5__persistent_session_settlement.sql \
            database/migrations/V1_6__payment_provider_bindings.sql \
            database/migrations/V1_7__identity_provider_bindings.sql \
            database/migrations/V1_8__bid_reservation_replacement.sql; do
            psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f "$f"
          done
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from (values ('auction.reservation_replacement')) x(name) where to_regclass(name) is not null")" = "1"

      - name: Compile integrated backend
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Start TiempoJusto runtime
        run: |
          java -jar backend/app/target/tiempojusto-app-1.0.0.jar > /tmp/tiempojusto-bid.log 2>&1 &
          echo $! > /tmp/tiempojusto-bid.pid
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/health.json; then
              grep -q '"status":"UP"' /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tiempojusto-bid.log
          exit 1

      - name: Execute normal Bid golden path
        run: |
          set -euo pipefail

          curl -fsS -X POST http://localhost:8080/api/v1/sandbox/identity/register \
            -H 'Content-Type: application/json' \
            -d '{"role":"HOST","email":"bid-host@tiempojusto.test","username":"bid_host","displayName":"Bid Host","publicAge":30,"supportsOnline":true}' > /tmp/host.json
          HOST_ID=$(python3 -c 'import json; print(json.load(open("/tmp/host.json"))["userId"])')
          HOST_PROFILE_ID=$(python3 -c 'import json; print(json.load(open("/tmp/host.json"))["hostProfileId"])')

          curl -fsS -X POST "http://localhost:8080/api/v1/sandbox/identity/users/$HOST_ID/verify-adult" \
            -H 'Content-Type: application/json' \
            -d '{"dateOfBirth":"1996-01-01","legalCountryCode":"CL"}' > /tmp/host-kyc.json

          curl -fsS -X POST http://localhost:8080/api/v1/sandbox/identity/register \
            -H 'Content-Type: application/json' \
            -d '{"role":"BIDDER","email":"bid-bidder@tiempojusto.test","username":"bid_bidder","displayName":"Bid Bidder","publicAge":31,"supportsOnline":false}' > /tmp/bidder.json
          BIDDER_ID=$(python3 -c 'import json; print(json.load(open("/tmp/bidder.json"))["userId"])')

          curl -fsS -X POST "http://localhost:8080/api/v1/sandbox/identity/users/$BIDDER_ID/verify-adult" \
            -H 'Content-Type: application/json' \
            -d '{"dateOfBirth":"1995-01-01","legalCountryCode":"CL"}' > /tmp/bidder-kyc.json

          curl -fsS -X POST http://localhost:8080/api/v1/sandbox/funding/me \
            -H "X-TJ-Actor-Id: $BIDDER_ID" \
            -H 'Content-Type: application/json' \
            -d '{"amountClp":100000}' > /tmp/funding.json

          curl -fsS -X POST http://localhost:8080/api/v1/sandbox/auctions \
            -H "X-TJ-Actor-Id: $HOST_ID" \
            -H 'Content-Type: application/json' \
            -d "{\"hostProfileId\":\"$HOST_PROFILE_ID\",\"durationMinutes\":30,\"openingAmountClp\":45000,\"closeNowAmountClp\":100000}" > /tmp/auction.json
          AUCTION_ID=$(python3 -c 'import json; print(json.load(open("/tmp/auction.json"))["id"])')

          psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 <<SQL
          with t as (select clock_timestamp() as now_at)
          update auction.auction a
             set started_at = t.now_at - interval '14 minutes',
                 scheduled_end_at = t.now_at + interval '1 minute',
                 effective_end_at = t.now_at + interval '1 minute'
            from t where a.id = '$AUCTION_ID'::uuid;
          SQL

          curl -fsS -X POST "http://localhost:8080/api/v1/auctions/$AUCTION_ID/bids" \
            -H "X-TJ-Actor-Id: $BIDDER_ID" \
            -H 'Idempotency-Key: ci-normal-bid-001' \
            -H 'Content-Type: application/json' \
            -d '{"amountClp":50000}' > /tmp/bid1.json
          cat /tmp/bid1.json
          grep -q '"reservationStrategy":"NEW"' /tmp/bid1.json
          grep -q '"timerReset":true' /tmp/bid1.json
          RES1=$(python3 -c 'import json; print(json.load(open("/tmp/bid1.json"))["fundsReservationId"])')

          curl -fsS -X POST "http://localhost:8080/api/v1/auctions/$AUCTION_ID/bids" \
            -H "X-TJ-Actor-Id: $BIDDER_ID" \
            -H 'Idempotency-Key: ci-normal-bid-002' \
            -H 'Content-Type: application/json' \
            -d '{"amountClp":55000}' > /tmp/bid2.json
          cat /tmp/bid2.json
          grep -q '"reservationStrategy":"ADJUSTED"' /tmp/bid2.json
          RES2=$(python3 -c 'import json; print(json.load(open("/tmp/bid2.json"))["fundsReservationId"])')
          test "$RES1" = "$RES2"

          curl -fsS -X POST "http://localhost:8080/api/v1/auctions/$AUCTION_ID/bids" \
            -H "X-TJ-Actor-Id: $BIDDER_ID" \
            -H 'Idempotency-Key: ci-normal-bid-002' \
            -H 'Content-Type: application/json' \
            -d '{"amountClp":55000}' > /tmp/replay.json
          grep -q '"replayed":true' /tmp/replay.json

          TOO_LOW_CODE=$(curl -sS -o /tmp/too-low.json -w '%{http_code}' -X POST "http://localhost:8080/api/v1/auctions/$AUCTION_ID/bids" \
            -H "X-TJ-Actor-Id: $BIDDER_ID" \
            -H 'Idempotency-Key: ci-normal-bid-003' \
            -H 'Content-Type: application/json' \
            -d '{"amountClp":60000}')
          test "$TOO_LOW_CODE" = "409"
          grep -q 'BID_TOO_LOW' /tmp/too-low.json

          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from auction.bid where auction_id='$AUCTION_ID'::uuid and bid_type='NORMAL' and status='VALID'")" = "2"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from auction.funds_reservation where id='$RES1'::uuid and status='RESERVED' and amount_clp=55000")" = "1"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from auction.reservation_replacement where auction_id='$AUCTION_ID'::uuid")" = "0"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from platform.outbox_event where aggregate_id='$AUCTION_ID'::uuid and event_type='BID_ACCEPTED'")" = "2"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from platform.outbox_event where aggregate_id='$AUCTION_ID'::uuid and event_type='TIMER_RESET_2M'")" -ge "1"

      - name: Print logs on failure
        if: failure()
        run: |
          cat /tmp/bid1.json || true
          cat /tmp/bid2.json || true
          cat /tmp/replay.json || true
          cat /tmp/too-low.json || true
          cat /tmp/tiempojusto-bid.log || true
