name: Online Reconnect Integration

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'database/**'
      - 'docs/runtime/ONLINE_RECONNECT_PERSISTENCE_V1.md'
      - '.github/workflows/online-reconnect-integration.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/app/**'
      - 'database/**'
      - '.github/workflows/online-reconnect-integration.yml'

jobs:
  reconnect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: tiempojusto
          POSTGRES_USER: tiempojusto
          POSTGRES_PASSWORD: tiempojusto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tiempojusto -d tiempojusto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: tiempojusto
      TJ_DB_URL: jdbc:postgresql://localhost:5432/tiempojusto
      TJ_DB_USER: tiempojusto
      TJ_DB_PASSWORD: tiempojusto
      TJ_AUTH_DEV_HEADER_ENABLED: 'true'
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load database through V1.5
        run: |
          psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/schema/TiempoJusto_PostgreSQL_Schema_V1_0.sql
          for f in database/migrations/V1_1__geo_routing_eta.sql database/migrations/V1_2__webrtc_media.sql database/migrations/V1_3__oauth2_identity.sql database/migrations/V1_4__online_reconnect_persistence.sql database/migrations/V1_5__persistent_session_settlement.sql; do
            psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f "$f"
          done
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from pg_indexes where indexname in ('one_open_paid_segment_uidx','one_open_reconnect_segment_uidx','one_unrecovered_online_incident_uidx')")" = "3"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from pg_class where oid='finance.session_settlement'::regclass")" = "1"
      - name: Build runtime
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Start runtime
        run: |
          java -jar backend/app/target/tiempojusto-app-1.0.0.jar > /tmp/tiempojusto-reconnect.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/health.json; then exit 0; fi
            sleep 2
          done
          cat /tmp/tiempojusto-reconnect.log
          exit 1
      - name: Execute persistent reconnect golden path
        run: |
          curl -fsS -X POST http://localhost:8080/internal/ci/golden-path/online-reconnect > /tmp/reconnect.json
          cat /tmp/reconnect.json
          grep -q '"status":"PASS"' /tmp/reconnect.json
          grep -q '"microCut4sState":"PAID_ACTIVE"' /tmp/reconnect.json
          grep -q '"interruption6sState":"RECONNECTING"' /tmp/reconnect.json
          grep -q '"recoveredWithoutBillingResumeState":"RECONNECTING"' /tmp/reconnect.json
          grep -q '"bilateralResumeState":"PAID_ACTIVE"' /tmp/reconnect.json
          grep -q '"timeoutState":"ENDED"' /tmp/reconnect.json
          grep -q '"persistentRecordingEnabled":false' /tmp/reconnect.json
      - name: Print runtime log on failure
        if: failure()
        run: cat /tmp/tiempojusto-reconnect.log || true
