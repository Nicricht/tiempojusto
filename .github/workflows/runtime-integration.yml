name: Runtime Integration

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'database/**'
      - 'docker-compose.yml'
      - 'docs/runtime/**'
      - '.github/workflows/runtime-integration.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'docker-compose.yml'
      - 'docs/runtime/**'
      - '.github/workflows/runtime-integration.yml'

jobs:
  postgres-and-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: tiempojusto
          POSTGRES_USER: tiempojusto
          POSTGRES_PASSWORD: tiempojusto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiempojusto -d tiempojusto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: tiempojusto
      TJ_DB_URL: jdbc:postgresql://localhost:5432/tiempojusto
      TJ_DB_USER: tiempojusto
      TJ_DB_PASSWORD: tiempojusto
      SPRING_PROFILES_ACTIVE: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Execute physical schema V1.0
        run: psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/schema/TiempoJusto_PostgreSQL_Schema_V1_0.sql

      - name: Execute Geo migration V1.1
        run: psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/migrations/V1_1__geo_routing_eta.sql

      - name: Execute Media migration V1.2
        run: psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/migrations/V1_2__webrtc_media.sql

      - name: Assert critical database objects
        run: |
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from pg_extension where extname in ('postgis','pgcrypto','citext')")" = "3"
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from (values ('iam.app_user'),('market.proposal'),('auction.auction'),('appointment.appointment_session'),('finance.ledger_entry'),('finance.payout'),('geo.route_estimate_snapshot'),('media.video_participant_state')) r(name) where to_regclass(name) is not null")" = "8"
          psql -h localhost -U tiempojusto -d tiempojusto -Atc "select postgis_version();"

      - name: Build all Java modules and integrated Spring Boot app
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Start integrated runtime
        run: |
          java -jar backend/app/target/tiempojusto-app-1.0.0.jar > /tmp/tiempojusto-app.log 2>&1 &
          echo $! > /tmp/tiempojusto-app.pid
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tiempojusto-app.log
          exit 1

      - name: Assert application health
        run: grep -q '"status":"UP"' /tmp/health.json

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/tiempojusto-app.log || true
