name: Media Core

on:
  pull_request:
    paths:
      - 'backend/media/**'
      - 'database/migrations/V1_2__webrtc_media.sql'
      - 'docs/media/**'
      - '.github/workflows/media.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/media/**'
      - 'database/migrations/V1_2__webrtc_media.sql'
      - 'docs/media/**'
      - '.github/workflows/media.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Media contract tests
        working-directory: backend/media
        run: bash run-tests.sh
      - name: Assert media SQL invariants
        run: |
          grep -q "video_paid_acceptance_30s_ck" database/migrations/V1_2__webrtc_media.sql
          grep -q "persistent_recording_enabled = false" database/migrations/V1_2__webrtc_media.sql
          grep -q "reconnect_deadline = media_lost_at + interval '2 minutes'" database/migrations/V1_2__webrtc_media.sql
          grep -q "Online PAID_ACTIVE requires HOST and BIDDER with valid camera/media" database/migrations/V1_2__webrtc_media.sql
