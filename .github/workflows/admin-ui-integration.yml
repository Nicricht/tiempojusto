name: Admin UI Integration

on:
  pull_request:
    paths:
      - 'backend/app/src/main/java/cl/tiempojusto/app/api/AdminReviewController.java'
      - 'backend/app/src/main/java/cl/tiempojusto/app/application/AdminReviewApplicationService.java'
      - 'frontend/src/features/AdminPage.tsx'
      - 'frontend/src/lib/api.ts'
      - 'frontend/src/lib/types.ts'
      - 'frontend/src/Root.tsx'
      - 'frontend/src/styles-extra.css'
      - '.github/workflows/admin-ui-integration.yml'
  push:
    branches: [ main ]
    paths:
      - 'backend/app/src/main/java/cl/tiempojusto/app/api/AdminReviewController.java'
      - 'backend/app/src/main/java/cl/tiempojusto/app/application/AdminReviewApplicationService.java'
      - 'frontend/src/features/AdminPage.tsx'
      - 'frontend/src/lib/api.ts'
      - 'frontend/src/lib/types.ts'
      - 'frontend/src/Root.tsx'
      - 'frontend/src/styles-extra.css'
      - '.github/workflows/admin-ui-integration.yml'

jobs:
  admin-ui-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: tiempojusto
          POSTGRES_USER: tiempojusto
          POSTGRES_PASSWORD: tiempojusto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiempojusto -d tiempojusto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: tiempojusto
      TJ_DB_URL: jdbc:postgresql://localhost:5432/tiempojusto
      TJ_DB_USER: tiempojusto
      TJ_DB_PASSWORD: tiempojusto
      TJ_AUTH_DEV_HEADER_ENABLED: 'true'
      SPRING_PROFILES_ACTIVE: ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply current schema and migrations
        run: |
          set -euo pipefail
          psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f database/schema/TiempoJusto_PostgreSQL_Schema_V1_0.sql
          for f in \
            database/migrations/V1_1__geo_routing_eta.sql \
            database/migrations/V1_2__webrtc_media.sql \
            database/migrations/V1_3__oauth2_identity.sql \
            database/migrations/V1_4__online_reconnect_persistence.sql \
            database/migrations/V1_5__persistent_session_settlement.sql \
            database/migrations/V1_6__payment_provider_bindings.sql \
            database/migrations/V1_7__identity_provider_bindings.sql \
            database/migrations/V1_8__bid_reservation_replacement.sql \
            database/migrations/V1_9__payment_webhook_reconciliation.sql \
            database/migrations/V1_10__kyc_webhook_reconciliation.sql; do
            psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed Admin user KYC and finance fixture
        run: |
          set -euo pipefail
          psql -h localhost -U tiempojusto -d tiempojusto -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          insert into iam.app_user(id, public_id, role, account_status, email)
          values
            ('11111111-1111-1111-1111-111111111111','admin_ui_ci','ADMIN','ACTIVE','admin-ui-ci@tiempojusto.test'),
            ('22222222-2222-2222-2222-222222222222','host_ui_ci','HOST','ACTIVE','host-ui-ci@tiempojusto.test');

          insert into iam.public_identity(user_id, display_name, username, public_age)
          values ('22222222-2222-2222-2222-222222222222','Host UI CI','host_ui_ci',30);

          insert into iam.identity_verification(
            id, user_id, provider_code, provider_reference, status,
            verified_adult, legal_country_code, date_of_birth, verified_at
          ) values (
            '33333333-3333-3333-3333-333333333333',
            '22222222-2222-2222-2222-222222222222',
            'VERIFF',
            'private-provider-reference-must-not-leak',
            'VERIFIED',
            true,
            'CL',
            date '1996-04-12',
            now()
          );

          insert into finance.ledger_account(id, owner_type, owner_user_id, account_type, currency)
          values
            ('44444444-4444-4444-4444-444444444444','USER','22222222-2222-2222-2222-222222222222','AVAILABLE','CLP'),
            ('55555555-5555-5555-5555-555555555555','PLATFORM',null,'REVENUE','CLP');

          insert into finance.ledger_transaction(
            id, transaction_type, reference_type, reference_id, status, idempotency_key
          ) values (
            '66666666-6666-6666-6666-666666666666',
            'SESSION_SETTLEMENT',
            'ADMIN_UI_CI',
            null,
            'PENDING',
            'admin-ui-ci-ledger'
          );

          insert into finance.ledger_entry(transaction_id, account_id, direction, amount_clp)
          values
            ('66666666-6666-6666-6666-666666666666','44444444-4444-4444-4444-444444444444','CREDIT',10000),
            ('66666666-6666-6666-6666-666666666666','55555555-5555-5555-5555-555555555555','DEBIT',10000);

          update finance.ledger_transaction
             set status = 'POSTED', posted_at = now()
           where id = '66666666-6666-6666-6666-666666666666';

          insert into finance.payout(
            id, host_user_id, source_transaction_id,
            gross_amount_clp, platform_fee_clp, net_amount_clp,
            pending_until, status
          ) values (
            '77777777-7777-7777-7777-777777777777',
            '22222222-2222-2222-2222-222222222222',
            '66666666-6666-6666-6666-666666666666',
            10000, 2000, 8000,
            now() + interval '60 minutes',
            'PENDING_HOLD'
          );

          commit;
          SQL

      - name: Build runtime
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Start runtime
        run: |
          java -jar backend/app/target/tiempojusto-app-1.0.0.jar > /tmp/tiempojusto-admin-ui.log 2>&1 &
          echo $! > /tmp/tiempojusto-admin-ui.pid
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/health.json; then
              grep -q '"status":"UP"' /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tiempojusto-admin-ui.log
          exit 1

      - name: Verify Admin RBAC and KYC privacy
        run: |
          set -euo pipefail
          ADMIN='X-TJ-Actor-Id: 11111111-1111-1111-1111-111111111111'
          HOST='X-TJ-Actor-Id: 22222222-2222-2222-2222-222222222222'

          CODE=$(curl -sS -o /tmp/non-admin.json -w '%{http_code}' \
            -H "$HOST" 'http://localhost:8080/api/v1/admin/users?query=host_ui_ci')
          test "$CODE" = '403'
          grep -q 'ADMIN_REQUIRED' /tmp/non-admin.json

          curl -fsS -H "$ADMIN" 'http://localhost:8080/api/v1/admin/users?query=host_ui_ci' > /tmp/users.json
          grep -q 'host_ui_ci' /tmp/users.json
          grep -q 'VERIFIED' /tmp/users.json
          grep -q '"verified_adult":true' /tmp/users.json
          ! grep -q 'host-ui-ci@tiempojusto.test' /tmp/users.json
          ! grep -q 'private-provider-reference-must-not-leak' /tmp/users.json
          ! grep -q '1996-04-12' /tmp/users.json
          ! grep -qi 'biometric\|selfie\|document' /tmp/users.json

      - name: Verify payout and ledger are readable but not manually editable
        run: |
          set -euo pipefail
          ADMIN='X-TJ-Actor-Id: 11111111-1111-1111-1111-111111111111'
          PAYOUT='77777777-7777-7777-7777-777777777777'
          TX='66666666-6666-6666-6666-666666666666'

          curl -fsS -H "$ADMIN" "http://localhost:8080/api/v1/admin/finance/payouts/$PAYOUT" > /tmp/payout.json
          grep -q '"gross_amount_clp":10000' /tmp/payout.json
          grep -q '"platform_fee_clp":2000' /tmp/payout.json
          grep -q '"net_amount_clp":8000' /tmp/payout.json
          grep -q 'PENDING_HOLD' /tmp/payout.json

          curl -fsS -H "$ADMIN" "http://localhost:8080/api/v1/admin/finance/ledger/$TX" > /tmp/ledger.json
          grep -q 'SESSION_SETTLEMENT' /tmp/ledger.json
          grep -q '"amount_clp":10000' /tmp/ledger.json

          CODE=$(curl -sS -o /tmp/illegal-finance.json -w '%{http_code}' \
            -X PATCH -H "$ADMIN" -H 'Content-Type: application/json' \
            -d '{"status":"AVAILABLE","netAmountClp":999999}' \
            "http://localhost:8080/api/v1/admin/finance/payouts/$PAYOUT")
          test "$CODE" = '405'
          grep -q 'ADMIN_FINANCE_READ_ONLY' /tmp/illegal-finance.json

          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select net_amount_clp from finance.payout where id='$PAYOUT'")" = '8000'

      - name: Verify audited objective payout hold lifecycle
        run: |
          set -euo pipefail
          ADMIN='X-TJ-Actor-Id: 11111111-1111-1111-1111-111111111111'
          PAYOUT='77777777-7777-7777-7777-777777777777'

          curl -fsS -X POST -H "$ADMIN" -H 'Content-Type: application/json' \
            -d '{"reasonCode":"OBJECTIVE_INCIDENT","evidenceRef":"ci:objective-evidence:1","safetyCaseId":null}' \
            "http://localhost:8080/api/v1/admin/finance/payouts/$PAYOUT/holds" > /tmp/hold-create.json
          grep -q '"status":"ACTIVE"' /tmp/hold-create.json
          grep -q 'ci:objective-evidence:1' /tmp/hold-create.json
          HOLD=$(python3 -c 'import json; print(json.load(open("/tmp/hold-create.json"))["id"])')

          curl -fsS -H "$ADMIN" "http://localhost:8080/api/v1/admin/finance/payouts/$PAYOUT/holds" > /tmp/holds.json
          grep -q "$HOLD" /tmp/holds.json
          grep -q 'ACTIVE' /tmp/holds.json

          curl -fsS -X POST -H "$ADMIN" -H 'Content-Type: application/json' \
            -d '{"reason":"CI objective evidence resolved"}' \
            "http://localhost:8080/api/v1/admin/finance/payouts/$PAYOUT/holds/$HOLD/release" > /tmp/hold-release.json
          grep -q '"status":"RELEASED"' /tmp/hold-release.json

          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from platform.admin_action where target_id='$PAYOUT'::uuid and action_type in ('CREATE_PAYOUT_HOLD','RELEASE_PAYOUT_HOLD')")" = '2'
          test "$(psql -h localhost -U tiempojusto -d tiempojusto -Atc "select count(*) from platform.audit_event where entity_type='PAYOUT' and entity_id='$PAYOUT'::uuid and event_type in ('PAYOUT_HOLD_CREATED','PAYOUT_HOLD_RELEASED')")" = '2'

          curl -fsS -H "$ADMIN" "http://localhost:8080/api/v1/admin/admin-actions?targetId=$PAYOUT" > /tmp/admin-actions.json
          grep -q 'CREATE_PAYOUT_HOLD' /tmp/admin-actions.json
          grep -q 'RELEASE_PAYOUT_HOLD' /tmp/admin-actions.json

          curl -fsS -H "$ADMIN" http://localhost:8080/api/v1/admin/audit-log > /tmp/audit.json
          grep -q 'PAYOUT_HOLD_CREATED' /tmp/audit.json
          grep -q 'PAYOUT_HOLD_RELEASED' /tmp/audit.json

      - name: Print runtime logs on failure
        if: failure()
        run: cat /tmp/tiempojusto-admin-ui.log || true
