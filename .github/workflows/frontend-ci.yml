name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.gitignore'
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Verify production artifact
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          if grep -R -q "VITE_TJ_DEV_MODE=true" frontend/dist/assets; then
            echo "Development mode marker leaked into production artifact"
            exit 1
          fi
