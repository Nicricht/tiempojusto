name: OpenAPI

on:
  push:
    paths:
      - 'api/openapi/**'
      - '.github/workflows/openapi.yml'
  pull_request:
    paths:
      - 'api/openapi/**'
      - '.github/workflows/openapi.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI 3.1
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi/openapi.yaml --extends=minimal
